tags:
  - name: Health
    description: API status
  - name: Auth
    description: Registration, login, sessions, profile
  - name: Products
    description: Product catalog
  - name: Categories
    description: Category management
  - name: Cart
    description: Shopping cart (guest & authenticated)
  - name: Orders
    description: Checkout and order management
  - name: Admin
    description: Dashboard and logs (admin only)
  - name: Public
    description: Public storefront endpoints

paths:
  /health:
    get:
      tags: [Health]
      summary: API health check
      security: []
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Customer or admin registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: customer@example.com
              password: SecurePass123
              firstName: Jane
              lastName: Doe
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already exists

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@marea.com
              password: Admin@123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token (token rotation)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke refresh token session
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /auth/verify-email/{token}:
    get:
      tags: [Auth]
      summary: Verify email address
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      responses:
        '200':
          description: Profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Auth]
      summary: Update profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
                avatar:
                  type: string
                  format: uri
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags: [Auth]
      summary: Delete account (soft delete)
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /products:
    get:
      tags: [Products]
      summary: List products with filters and pagination
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, HIDDEN, ARCHIVED]
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: featured
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessList'
    post:
      tags: [Products]
      summary: Create product (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /products/slug/{slug}:
    get:
      tags: [Products]
      summary: Get product by slug
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          example: gold-bracelet
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by ID
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Products]
      summary: Update product (admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags: [Products]
      summary: Soft delete product (admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /products/{id}/restore:
    post:
      tags: [Products]
      summary: Restore archived product (admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /categories:
    get:
      tags: [Categories]
      summary: List categories (flat)
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      tags: [Categories]
      summary: Create category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          $ref: '#/components/responses/Success'

  /categories/tree:
    get:
      tags: [Categories]
      summary: Nested category tree
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Get category by ID
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    patch:
      tags: [Categories]
      summary: Update category (admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags: [Categories]
      summary: Soft delete category (admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /cart:
    get:
      tags: [Cart]
      summary: Get cart (guest or user)
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: string
                  format: uuid
                variantId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 1
            example:
              productId: 00000000-0000-0000-0000-000000000001
              quantity: 1
      responses:
        '201':
          $ref: '#/components/responses/Success'

  /cart/items/{itemId}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags: [Cart]
      summary: Remove item from cart
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /orders:
    post:
      tags: [Orders]
      summary: Place order (COD supported)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Orders]
      summary: List orders (own orders or all for admin)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, CONFIRMED, PROCESSING, PACKED, SHIPPED, DELIVERED, CANCELLED, REFUNDED, RETURNED]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status (admin)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, CONFIRMED, PROCESSING, PACKED, SHIPPED, DELIVERED, CANCELLED, REFUNDED, RETURNED]
                note:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Dashboard statistics
      responses:
        '200':
          description: Sales, orders, customers, inventory stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Audit trail
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/admin-logs:
    get:
      tags: [Admin]
      summary: Admin activity logs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /public/recent-orders:
    get:
      tags: [Public]
      summary: Live sales popup data
      security: []
      responses:
        '200':
          description: Recent order snippets for storefront popup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /public/live-sale-settings:
    get:
      tags: [Public]
      summary: Live sale popup configuration
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    Page:
      in: query
      name: page
      schema:
        type: integer
        default: 1
        minimum: 1
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    SessionId:
      in: header
      name: x-session-id
      description: Guest cart session ID
      schema:
        type: string
      example: guest-abc123

  responses:
    Success:
      description: Operation successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    Unauthorized:
      description: Invalid or missing token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Unauthorized
            code: UNAUTHORIZED
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          nullable: true
        meta:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: string

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
          default: CUSTOMER

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            user:
              type: object
            accessToken:
              type: string
            refreshToken:
              type: string

    SuccessUser:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: string
                email:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string

    SuccessList:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            meta:
              type: object
              properties:
                page:
                  type: integer
                limit:
                  type: integer
                total:
                  type: integer
                totalPages:
                  type: integer

    ProductInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        sku:
          type: string
        price:
          type: number
        salePrice:
          type: number
        status:
          type: string
          enum: [DRAFT, PUBLISHED, HIDDEN, ARCHIVED]
        categoryId:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        parentId:
          type: string
          format: uuid
        sortOrder:
          type: integer
        isFeatured:
          type: boolean

    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        paymentMethod:
          type: string
          enum: [COD, STRIPE, PAYPAL, MYFATOORAH]
          default: COD
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
                format: uuid
              variantId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
        shippingAddress:
          type: object
          properties:
            line1:
              type: string
            city:
              type: string
            country:
              type: string
        billingAddress:
          type: object
        customerNotes:
          type: string
        tax:
          type: number
        shipping:
          type: number
        discount:
          type: number
