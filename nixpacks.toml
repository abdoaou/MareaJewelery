# Railway / Nixpacks: build storefront + admin, then run API which serves them
[phases.setup]
nixPkgs = ["openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npx prisma generate --schema=api/prisma/schema.prisma",
  "npm run build -w website",
  "npm run build:hosted -w admin",
]

[start]
cmd = "npm run start -w api"
