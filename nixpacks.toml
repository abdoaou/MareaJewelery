# Dokploy / Railway / Nixpacks — monorepo: build website + admin, run API
providers = ["node"]

[phases.setup]
# Must include Node.js — setup-only openssl removes npm from PATH (causes exit 127)
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
# Install devDependencies too (vite, typescript) — NODE_ENV must not be production here
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = [
  "npx prisma generate --schema=api/prisma/schema.prisma",
  "NODE_OPTIONS=--max-old-space-size=4096 npm run build -w website",
  "NODE_OPTIONS=--max-old-space-size=4096 npm run build:hosted -w admin",
]

[start]
cmd = "NODE_ENV=production npm run start -w api"
